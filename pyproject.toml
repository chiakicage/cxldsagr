# 当前 .venv 的完整依赖快照，包含直接依赖和间接依赖。
# 采集环境：CPython 3.12.3；此文件不是经过解析验证的 lockfile。
# torch 的 +cu130 构建未记录下载来源，重建时需提供包含该版本的索引或 wheel。
[project]
name = "dsa"
version = "0.1.0"
description = "KV cache offload and sparse attention experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 核心计算依赖
    "torch==2.12.1+cu130",
    "triton==3.7.1",
    "numpy==2.5.0",
    "cuda-bindings==13.0.3",
    "cuda-pathfinder==1.2.2",
    "cuda-toolkit==13.0.2",
    # 本地 CUDA 扩展；DeepGEMM 版本后缀由源码提交状态生成
    "deep-gemm",  # 当前已安装：2.5.0+a6b593d；使用下方本地源码
    "flash-mla-sm120==0.1.0",
    # 构建与测试工具
    "ninja==1.13.0",
    "packaging==26.2",
    "setuptools==70.2.0",
    "wheel==0.47.0",
    "pytest==9.1.1",
    "iniconfig==2.3.0",
    "pluggy==1.6.0",
    "pygments==2.20.0",
    # CUDA 运行库：保留当前环境同时安装的 CUDA 12 / 13 组件
    "nvidia-cublas==13.1.1.3",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cuda-cupti==13.0.85",
    "nvidia-cuda-cupti-cu12==12.8.90",
    "nvidia-cuda-nvrtc==13.0.88",
    "nvidia-cuda-nvrtc-cu12==12.8.93",
    "nvidia-cuda-runtime==13.0.96",
    "nvidia-cuda-runtime-cu12==12.8.90",
    "nvidia-cudnn-cu12==9.19.0.56",
    "nvidia-cudnn-cu13==9.20.0.48",
    "nvidia-cufft==12.0.0.61",
    "nvidia-cufft-cu12==11.3.3.83",
    "nvidia-cufile==1.15.1.6",
    "nvidia-cufile-cu12==1.13.1.3",
    "nvidia-curand==10.4.0.35",
    "nvidia-curand-cu12==10.3.9.90",
    "nvidia-cusolver==12.0.4.66",
    "nvidia-cusolver-cu12==11.7.3.90",
    "nvidia-cusparse==12.6.3.3",
    "nvidia-cusparse-cu12==12.5.8.93",
    "nvidia-cusparselt-cu12==0.7.1",
    "nvidia-cusparselt-cu13==0.8.1",
    "nvidia-nccl-cu12==2.28.9",
    "nvidia-nccl-cu13==2.29.7",
    "nvidia-nvjitlink==13.0.88",
    "nvidia-nvjitlink-cu12==12.8.93",
    "nvidia-nvshmem-cu12==3.4.5",
    "nvidia-nvshmem-cu13==3.4.5",
    "nvidia-nvtx==13.0.85",
    "nvidia-nvtx-cu12==12.8.90",
    # 其他已安装依赖（含间接依赖）
    "filelock==3.29.0",
    "fsspec==2026.4.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "sympy==1.14.0",
    "typing-extensions==4.15.0",
]

[tool.uv]
package = false
# 两个扩展在构建时导入 torch，使用环境中已安装的构建依赖。
no-build-isolation-package = ["deep-gemm", "flash-mla-sm120"]

[tool.uv.sources]
deep-gemm = { path = "DeepGEMM" }
flash-mla-sm120 = { path = "sparse_mla_sm120", editable = true }
