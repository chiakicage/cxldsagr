# 基于原环境快照的依赖配置，包含直接依赖和间接依赖。
# 使用 uv.lock 固定解析结果；Python 版本要求见 requires-python。
# torch 的 CUDA 13.0 构建使用下方 PyTorch 官方索引。
[project]
name = "dsa"
version = "0.1.0"
description = "KV cache offload and sparse attention experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 核心计算依赖
    "torch==2.12.1+cu130",
    "triton==3.7.1",
    "numpy==2.5.0",
    "cuda-bindings==13.0.3",
    "cuda-pathfinder==1.2.2",
    "cuda-toolkit==13.0.2",
    # 本地 CUDA 扩展；DeepGEMM 版本后缀由源码提交状态生成
    "deep-gemm",  # 版本由下方本地源码决定
    "flash-mla-sm120==0.1.0",
    # 构建与测试工具
    "ninja==1.13.0",
    "packaging==26.2",
    "setuptools==70.2.0",
    "wheel==0.47.0",
    "pytest==9.1.1",
    "iniconfig==2.3.0",
    "pluggy==1.6.0",
    "pygments==2.20.0",
    # CUDA 13 运行库；不要混装 CUDA 12 包，以免覆盖同路径的动态库。
    "nvidia-cublas==13.1.1.3",
    "nvidia-cuda-cupti==13.0.85",
    "nvidia-cuda-nvrtc==13.0.88",
    "nvidia-cuda-runtime==13.0.96",
    "nvidia-cudnn-cu13==9.20.0.48",
    "nvidia-cufft==12.0.0.61",
    "nvidia-cufile==1.15.1.6",
    "nvidia-curand==10.4.0.35",
    "nvidia-cusolver==12.0.4.66",
    "nvidia-cusparse==12.6.3.3",
    "nvidia-cusparselt-cu13==0.8.1",
    "nvidia-nccl-cu13==2.29.7",
    "nvidia-nvjitlink==13.0.88",
    "nvidia-nvshmem-cu13==3.4.5",
    "nvidia-nvtx==13.0.85",
    # 其他已安装依赖（含间接依赖）
    "filelock==3.29.0",
    "fsspec==2026.4.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "sympy==1.14.0",
    "typing-extensions==4.15.0",
    "tokenizers==0.23.2",
    "ijson==3.5.1",
]

[tool.uv]
package = false
# 使用 uv 管理的 Python，确保编译 CUDA 扩展所需的 Python.h 可用。
python-preference = "only-managed"

# setup.py 在解析元数据时就导入 torch，因此构建环境也必须显式安装它。
# 与运行时使用相同版本，避免扩展的 PyTorch ABI 不匹配。
[tool.uv.extra-build-dependencies]
deep-gemm = ["torch==2.12.1+cu130", "packaging==26.2", "wheel==0.47.0", "ninja==1.13.0"]
flash-mla-sm120 = ["torch==2.12.1+cu130", "ninja==1.13.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
deep-gemm = { path = "DeepGEMM" }
flash-mla-sm120 = { path = "sparse_mla_sm120", editable = true }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
# 子项目单独维护格式；显式传入文件时也遵守排除规则。
extend-exclude = ["DeepGEMM", "sparse_mla_sm120", "models", "GR/generated"]
force-exclude = true

[tool.ruff.lint.per-file-ignores]
# GR 是现有包名，保留其导入路径。
"GR/__init__.py" = ["N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
analysis = [
    "matplotlib>=3.11.1",
]
dev = [
    "ruff>=0.16.6",
]
